<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Mi Progreso</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#2563eb;color:white;padding:22px 18px 28px;border-radius:0 0 24px 24px}header h1{margin:0;font-size:28px}header p{margin:5px 0 0;opacity:.9}
main{max-width:720px;margin:-12px auto 80px;padding:0 12px}.tabs{display:flex;gap:6px;background:white;padding:6px;border-radius:15px;box-shadow:0 4px 15px #0001;margin-bottom:12px;position:sticky;top:8px;z-index:5}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:700;color:#667085}.tabs .on{background:#e9efff;color:#2563eb}
.card{background:#fff;border:1px solid #e6e9ee;border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#f8fafc;border-radius:13px}.num{font-size:25px;font-weight:800}.lab{font-size:12px;color:#667085}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #dce2ea;background:#fff;border-radius:13px;padding:13px;text-align:left;cursor:pointer}.btn b{display:block}.btn small{color:#667085}.primary{background:#2563eb!important;color:white;border:0!important;font-weight:800!important;text-align:center!important}
h2{font-size:18px;margin:2px 0 13px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f3}.row:last-child{border:0}.x{border:0;background:#f1f3f6;border-radius:8px;padding:4px 8px}.muted{color:#667085;font-size:13px}input,select{width:100%;padding:11px;border:1px solid #d5dbe4;border-radius:10px;background:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.hide{display:none}.empty{text-align:center;color:#667085;padding:18px}
</style></head>
<body>
<header><h1>💪 Mi Progreso</h1><p>Tu seguimiento diario, sencillo y rápido</p></header>
<main>
<div class="tabs"><button class="on" onclick="tab('hoy',this)">Hoy</button><button onclick="tab('hist',this)">Historial</button><button onclick="tab('aj',this)">Ajustes</button></div>

<section id="hoy">
<div class="card"><div class="form"><div><label>Fecha</label><input id="fecha" type="date"></div><div><label>Peso kg</label><input id="peso" type="number" step=".1" placeholder="90"></div></div></div>
<div class="stats">
<div class="stat"><div class="num" id="com">0</div><div class="lab">kcal comidas</div></div>
<div class="stat"><div class="num" id="ej">0</div><div class="lab">kcal ejercicio</div></div>
<div class="stat"><div class="num" id="gas">0</div><div class="lab">gasto estimado</div></div>
<div class="stat"><div class="num" id="bal">0</div><div class="lab">balance</div></div>
</div>
<div class="card"><h2>🍽️ ¿Qué has comido?</h2><div class="grid" id="comidas"></div></div>
<div class="card"><h2>🏃 ¿Qué ejercicio has hecho?</h2><div class="grid" id="ejercicios"></div></div>
<div class="card"><h2>📝 Registro</h2><div id="registro"></div></div>
</section>

<section id="hist" class="hide"><div class="card"><h2>📅 Últimos días</h2><div id="lista"></div></div></section>

<section id="aj" class="hide">
<div class="card"><h2>⚙️ Tus datos</h2><div class="form">
<div><label>Edad</label><input id="edad" type="number"></div><div><label>Altura cm</label><input id="altura" type="number"></div>
<div><label>Peso inicial kg</label><input id="pini" type="number" step=".1"></div><div><label>Actividad</label><select id="act"><option value="1.2">Sedentario</option><option value="1.35">Ligero</option><option value="1.5">Moderado</option></select></div>
</div><br><button class="btn primary" onclick="guardar()">Guardar</button></div>
<div class="card"><h2>➕ Añadir alimento</h2><div class="form"><input id="fn" placeholder="Ej. Yogur"><input id="fk" type="number" placeholder="kcal"></div><br><button class="btn primary" onclick="nuevo()">Añadir</button></div>
<div class="card"><h2>💾 Copia de seguridad</h2><button class="btn" onclick="exportar()">Exportar datos</button><p class="muted">Los datos se guardan en este navegador.</p></div>
</section>
</main>
<script>
const F=[
["🥣 Avena 40 g",150],["🥛 Yogur 250 g",150],["🍇 Uvas 150 g",100],["🍓 Fresas 200 g",65],
["🍊 Naranja",70],["🍊 Mandarina",40],["🍎 Manzana",90],["🍉 Melón/sandía 300 g",90],
["🍚 Arroz 70 g seco",250],["🍝 Pasta 80 g seca",285],["🍗 Pollo 200 g",220],["🍗 Pollo 250 g",275],
["🍤 Gambas 150 g",110],["🥚 Huevo",70],["🥔 Patata 200 g",155],["🍄 Champiñones 250 g",55],
["🥬 Espinacas 250 g",60],["🧅 1/2 cebolla",30],["🍞 Pan integral 2 rebanadas",150],["🥩 Jamón serrano 50 g",125]];
const E=[["🚶 Caminar 30 min",130],["🚶 Caminar 45 min",190],["🚶 Caminar 60 min",250],["🚶 Caminar 90 min",375],["💪 Fuerza 30 min",180],["💪 Fuerza 45 min",260],["🏢 10 pisos",45],["🏢 20 pisos",90]];
let S=JSON.parse(localStorage.getItem("MP2")||"{}");S.d=S.d||{};S.f=S.f||F;S.e=S.e||E;S.u=S.u||{edad:25,altura:185,peso:90,act:1.35};
let fecha=new Date().toISOString().slice(0,10);fechaEl().value=fecha;
function fechaEl(){return document.getElementById("fecha")}function save(){localStorage.setItem("MP2",JSON.stringify(S))}
function D(){return S.d[fecha]||(S.d[fecha]={f:[],e:[],p:""})}
function kcalBase(){let d=D(),w=+d.p||+S.u.peso,b=10*w+6.25*S.u.altura-5*S.u.edad+5;return Math.round(b*S.u.act)}
function render(){
 let d=D(),fc=d.f.reduce((a,x)=>a+x.k,0),ec=d.e.reduce((a,x)=>a+x.k,0),g=kcalBase()+ec;
 document.getElementById('com').textContent=fc;document.getElementById('ej').textContent=ec;document.getElementById('gas').textContent=g;document.getElementById('bal').textContent=g-fc;document.getElementById('peso').value=d.p||"";
 document.getElementById('comidas').innerHTML=S.f.map((x,i)=>`<button class="btn" onclick="af(${i})"><b>${x[0]}</b><small>${x[1]} kcal</small></button>`).join("");
 document.getElementById('ejercicios').innerHTML=S.e.map((x,i)=>`<button class="btn" onclick="ae(${i})"><b>${x[0]}</b><small>${x[1]} kcal</small></button>`).join("");
 let a=d.f.map((x,i)=>`<div class=row><span>🍽️ ${x.n}</span><span>${x.k} <button class=x onclick="del('f',${i})">×</button></span></div>`);
 let b=d.e.map((x,i)=>`<div class=row><span>🏃 ${x.n}</span><span>−${x.k} <button class=x onclick="del('e',${i})">×</button></span></div>`);
 document.getElementById('registro').innerHTML=a.concat(b).join("")||'<div class=empty>No hay registros todavía.</div>';
}
function af(i){let x=S.f[i];D().f.push({n:x[0],k:x[1]});save();render()}
function ae(i){let x=S.e[i];D().e.push({n:x[0],k:x[1]});save();render()}
function del(t,i){D()[t].splice(i,1);save();render()}
fechaEl().addEventListener('change',()=>{fecha=fechaEl().value;render()});document.getElementById('peso').addEventListener('input',()=>{D().p=document.getElementById('peso').value;save();render()});
function tab(id,b){document.querySelectorAll("main section").forEach(x=>x.classList.add("hide"));document.getElementById(id).classList.remove("hide");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(id==="hist")hist()}
function hist(){let a=Object.entries(S.d).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('lista').innerHTML=a.map(([day,d])=>{let f=d.f.reduce((s,x)=>s+x.k,0),e=d.e.reduce((s,x)=>s+x.k,0);return `<div class=row><span><b>${day}</b> · ${d.p?d.p+" kg":"sin peso"}</span><span>${f} kcal</span></div>`}).join("")||'<div class=empty>Aún no hay días.</div>'}
document.getElementById('edad').value=S.u.edad;document.getElementById('altura').value=S.u.altura;document.getElementById('pini').value=S.u.peso;document.getElementById('act').value=S.u.act;
function guardar(){S.u={edad:+document.getElementById('edad').value,altura:+document.getElementById('altura').value,peso:+document.getElementById('pini').value,act:+document.getElementById('act').value};save();render();alert("Guardado")}
function nuevo(){let n=document.getElementById('fn').value.trim(),k=+document.getElementById('fk').value;if(!n||!k)return alert("Completa nombre y kcal");S.f.push([n,k]);save();document.getElementById('fn').value="";document.getElementById('fk').value="";render();alert("Añadido")}
function exportar(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="mi_progreso_datos.json";a.click()}
render();
</script></body></html>
